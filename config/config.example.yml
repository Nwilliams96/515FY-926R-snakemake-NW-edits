samplesheet: "config/samples.tsv"
studyName: "example-study"

# Set to true to skip database download/training and reuse database_dir.
use_preexisting_databases: false
# Keep databases outside this run-specific repository clone so other runs can reuse them.
database_dir: "../eASV-databases"

rawdatadir: "/path/to/demultiplexed-fastq-files/"
R1file_ending: ".R1.fastq.gz"
R2file_ending: ".R2.fastq.gz"

use_internal_standards: false
intstds:
  intstd1: "ISD_1"
  intstd2: "ISD_2"
  intstd3: "ISD_3"

trunclens:
  truncR1: 220
  truncR2: 180

fwdPrimer: "GTGYCAGCMGCCGCGGTAA"
revPrimer: "CCGYCAATTYMTTTRAGTTT"
qiime2version: "../envs/qiime2-amplicon-ubuntu-2024-5-conda.yml"
SILVAversion: "138.1"
